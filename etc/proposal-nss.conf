# Configuration for libnss_proposal.so.2 (glibc NSS offers no per-module options in
# nsswitch.conf, so this lives in its own file). Both keys are required; if the file is
# missing or invalid the module exposes no users.
#
# GID of `exfel_prop_syn`: primary group of every proposal user.
primary_gid = 15355
# GID of `exfel`: supplementary group of every proposal user.
supplementary_gid = 3555
