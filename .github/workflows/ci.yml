name: ci
on:
  # branches get CI through their PR (tested merged with the base); push only for main and release tags
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
# one run per PR: newer runs cancel older ones (stack pushes fire several events per PR); main and
# tag pushes queue instead, so every commit there gets a full run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# read-only token by default; jobs that need more declare it
permissions:
  contents: read
# only main saves caches: a PR's cache is readable by that PR alone, so PR writes only evict main's
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
jobs:
  host:
    # pinned: the AppArmor userns workaround below is specific to this image version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # tests/scripts/in-userns.sh needs unprivileged user namespaces, blocked by AppArmor on 24.04
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo nextest run
      # after the tests, so a lint failure does not hide test results
      - run: cargo clippy --all-targets --all-features -- -D warnings
  container:
    runs-on: ubuntu-24.04
    # a cold build (Slurm RPMs from source) takes ~7 min; a hung Slurm daemon must not hold the runner for 6 h
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # mikepenz/action-junit-report
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pnss-test:ci
          # distinct scope: the rpm job uses the default scope
          cache-from: type=gha,scope=container-test
          # ignore-error: a failed cache write must not fail the build
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,scope=container-test,mode=max,ignore-error=true' || '' }}
      # a failing run fails the job; named (no --rm) so junit.xml can be copied out
      - run: docker run --name pnss-test pnss-test:ci
      - if: always()
        run: docker cp pnss-test:/src/target/nextest/ci/junit.xml junit.xml
      - if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/Dockerfile.el9
          target: rpms
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,ignore-error=true' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: rpms
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # every test job, not only the build: a tag on a failing commit must not publish
    needs: [host, container, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "${GITHUB_REF_NAME#v}" = "$ver" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $ver" >&2; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: rpms
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/x86_64/proposal-nss-${GITHUB_REF_NAME#v}-1.el9.x86_64.rpm" \
            "dist/srpms/proposal-nss-${GITHUB_REF_NAME#v}-1.el9.src.rpm" \
            --generate-notes
