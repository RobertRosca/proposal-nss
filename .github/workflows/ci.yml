name: ci
on:
  # branches get CI through their PR (tested merged with the base); push only for main and release tags
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
# one run per PR: newer runs cancel older ones (stack pushes fire several events per PR); main and
# tag pushes queue instead, so every commit there gets a full run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# read-only token by default; jobs that need more declare it
permissions:
  contents: read
# only main saves caches: a PR's cache is readable by that PR alone, so PR writes only evict main's
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
jobs:
  host:
    # pinned: the AppArmor userns workaround below is specific to this image version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@v2.90.10
        with:
          tool: cargo-nextest
      # tests/scripts/in-userns.sh needs unprivileged user namespaces, blocked by AppArmor on 24.04
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo nextest run
      # after the tests, so a lint failure does not hide test results
      - run: cargo clippy --all-targets --all-features -- -D warnings
  container:
    runs-on: ubuntu-24.04
    # a cold build (Slurm RPMs from source) takes ~7 min; a hung Slurm daemon must not hold the runner for 6 h
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # mikepenz/action-junit-report
      packages: write # registry cache in ghcr; only used on main
    steps:
      # main writes the cache; PRs read it anonymously, so the ghcr package must be public.
      # ghcr refs must be lowercase, which expressions cannot do, hence bash ${,,}
      - run: echo "TEST_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}-test-cache:main" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - if: env.SAVE_CACHE == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: pnss-test:ci
          # registry cache survives GHA cache eviction, so a cold cache does not rebuild Slurm
          cache-from: type=registry,ref=${{ env.TEST_CACHE }}
          # ignore-error: a failed cache write must not fail the build
          cache-to: ${{ env.SAVE_CACHE == 'true' && format('type=registry,ref={0},mode=max,ignore-error=true', env.TEST_CACHE) || '' }}
      # a failing run fails the job; the bind mount keeps junit.xml on the host either way
      - run: docker run --rm -v "$PWD/junit:/src/target/nextest/ci" pnss-test:ci
      - if: always()
        uses: mikepenz/action-junit-report@v6.7.1
        with:
          report_paths: junit/junit.xml
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packaging/Dockerfile.el9
          target: rpms
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,ignore-error=true' || '' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rpms
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # every test job, not only the build: a tag on a failing commit must not publish
    needs: [host, container, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check tag matches Cargo.toml version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "${GITHUB_REF_NAME#v}" = "$ver" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $ver" >&2; exit 1; }
      - uses: actions/download-artifact@v8.0.2
        with:
          name: rpms
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/x86_64/proposal-nss-${GITHUB_REF_NAME#v}-1.el9.x86_64.rpm" \
            "dist/srpms/proposal-nss-${GITHUB_REF_NAME#v}-1.el9.src.rpm" \
            --generate-notes
