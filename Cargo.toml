[package]
name = "proposal-nss"
version = "0.1.0"
edition = "2024"

[lib]
name = "nss_proposal"
crate-type = ["cdylib"]

[features]
# test builds only: conf path from PROPOSAL_NSS_CONF (see conf_path in src/lib.rs)
test-conf = []

[dependencies]
libnss = "0.9"
libc = "0.2" # required by the libnss_*_hooks! macro expansions
walkdir = "2.5"

[dev-dependencies]
rstest = { version = "0.29.0", default-features = false }
