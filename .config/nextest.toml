experimental = ["setup-scripts", "wrapper-scripts"]

# default profile = host: unit + NSS tests in a user namespace, no root, no Docker.
# ci profile = the Docker image (see Dockerfile): everything, with real fixtures and Slurm.
[profile.default]
default-filter = 'not (binary(sudo) or binary(slurm))'

[scripts.wrapper.userns]
command = 'test/in-userns.sh'

# cargo only builds the cdylib for `cargo build`, not for tests. The nss tests load this test-conf
# build (conf path from PROPOSAL_NSS_CONF); its own target dir keeps the feature out of regular builds.
[scripts.setup.build-module]
command = 'cargo build --lib --features test-conf --target-dir target/test-conf'

[[profile.default.scripts]]
filter = 'binary(nss)'
setup = 'build-module'
run-wrapper = 'userns'

[scripts.setup.nss-fixtures]
command = 'test/setup-fixtures.sh'

[scripts.setup.slurm]
command = 'test/setup-slurm.sh'
slow-timeout = { period = "90s", terminate-after = 2 }
leak-timeout = "1s" # the daemons outlive the script
capture-stdout = true
capture-stderr = true

# ci inherits default's script rules; the container is already isolated, so the nss binary only
# needs the test-conf module on its library path
[scripts.wrapper.test-module]
command = 'test/with-test-module.sh'

[[profile.ci.scripts]]
filter = 'binary(nss)'
run-wrapper = 'test-module'

[[profile.ci.scripts]]
filter = 'binary(nss) or binary(sudo) or binary(slurm)'
setup = 'nss-fixtures'

[[profile.ci.scripts]]
filter = 'binary(slurm)'
setup = 'slurm'

[profile.ci]
default-filter = 'all()'
fail-fast = false

# require_prop_dir tests rewrite the shared proposal-nss.conf, hiding proposal users without a dir
# from every daemon: run them with the whole test pool to themselves.
[[profile.ci.overrides]]
filter = 'binary(slurm) and test(/^require_prop_dir_/)'
threads-required = 'num-cpus'

[profile.ci.junit]
path = "junit.xml"

# prolog tests share the node, its /nonexistent and the prolog logs
[test-groups.prolog]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/^prolog_/)'
test-group = 'prolog'
